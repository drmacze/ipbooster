name: Deploy iPBooster to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check performance-engine.js
          node --check native-mode-setup.js
          node --check official-shortcut-template.js
          node --check smart-launch.js
          node --check router-fix.js
          node --check v3-observer-guard.js
          node --check v3-engine.js
          node --check v3-readiness.js
          node --check sw.js
      - name: Validate JSON
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          python -m json.tool shortcut-template.json > /dev/null
      - name: Verify core PWA files
        run: |
          test -f index.html
          test -f styles.css
          test -f v3.css
          test -f performance-engine.js
          test -f native-mode-setup.js
          test -f official-shortcut-template.js
          test -f shortcut-template.json
          test -f manifest.webmanifest
          test -f assets/icon-180.png
          test -f assets/icon-512.png
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
